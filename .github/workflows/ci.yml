name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write

env:
  IMAGE_NAME: ${{ github.repository }}
  TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: test-results/

      - name: Publish JUnit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/**/*.xml

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build backend image
        run: |
          docker build -t backend:latest .

      - name: Tag backend image
        run: |
          docker tag backend:latest ghcr.io/${IMAGE_NAME}:${TAG}

      - name: Push backend image
        run: |
          docker push ghcr.io/${IMAGE_NAME}:${TAG}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
          branches: main
          extends: ""
          plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Re-tag Docker image with semver
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          SEMVER: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          docker pull ghcr.io/${IMAGE_NAME}:${TAG}
          docker tag  ghcr.io/${IMAGE_NAME}:${TAG} ghcr.io/${IMAGE_NAME}:${SEMVER}
          docker tag  ghcr.io/${IMAGE_NAME}:${TAG} ghcr.io/${IMAGE_NAME}:latest
          docker push ghcr.io/${IMAGE_NAME}:${SEMVER}
          docker push ghcr.io/${IMAGE_NAME}:latest
